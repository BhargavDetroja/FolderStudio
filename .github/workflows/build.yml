name: Build & Release Foldero

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: Build & Package macOS App
    runs-on: macos-14
    permissions:
      contents: write
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 16
        run: |
          XCODE_APP=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | sort -V | tail -n 1)
          if [ -n "$XCODE_APP" ]; then
            echo "Selecting $XCODE_APP"
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          fi
          xcodebuild -version
          swift --version

      - name: Build macOS Release App
        run: |
          xcodebuild \
            -project FolderStudio.xcodeproj \
            -scheme FolderStudio \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath ./build \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" \
            clean build

      - name: Package Distributable Artifacts (DMG & ZIP)
        run: |
          ROOT_DIR="$(pwd)"
          APP_PATH="$ROOT_DIR/build/Build/Products/Release/FolderStudio.app"
          DIST_DIR="$ROOT_DIR/dist"
          
          if [ ! -d "$APP_PATH" ]; then
            echo "Error: App bundle not found at $APP_PATH"
            exit 1
          fi

          mkdir -p "$DIST_DIR"
          
          # Create ZIP archive
          cd "$ROOT_DIR/build/Build/Products/Release"
          zip -r -y "$DIST_DIR/Foldero-macOS.zip" FolderStudio.app
          cd "$ROOT_DIR"

          # Create DMG
          DMG_STAGING="$ROOT_DIR/dmg_staging"
          rm -rf "$DMG_STAGING"
          mkdir -p "$DMG_STAGING"
          cp -R "$APP_PATH" "$DMG_STAGING/"
          ln -s /Applications "$DMG_STAGING/Applications"
          
          hdiutil create \
            -volname "Foldero" \
            -srcfolder "$DMG_STAGING" \
            -ov \
            -format UDZO \
            "$DIST_DIR/Foldero-macOS.dmg"
          
          rm -rf "$DMG_STAGING"
          
          ls -lh "$DIST_DIR"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Foldero-macOS-Build
          path: |
            dist/Foldero-macOS.dmg
            dist/Foldero-macOS.zip
          retention-days: 14

      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Foldero-macOS.dmg
            dist/Foldero-macOS.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
