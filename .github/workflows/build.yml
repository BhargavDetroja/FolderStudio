name: Build & Release Foldero

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: Build & Package macOS App
    runs-on: macos-14
    permissions:
      contents: write
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show Xcode Version
        run: |
          xcodebuild -version
          swift --version

      - name: Build macOS Release App
        run: |
          xcodebuild \
            -project FolderStudio.xcodeproj \
            -scheme FolderStudio \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath ./build \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" \
            clean build

      - name: Package Distributable Artifacts (DMG & ZIP)
        run: |
          APP_PATH="./build/Build/Products/Release/FolderStudio.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Error: App bundle not found at $APP_PATH"
            exit 1
          fi

          mkdir -p dist
          
          # Create ZIP archive
          cd ./build/Build/Products/Release
          zip -r -y ../../../dist/Foldero-macOS.zip FolderStudio.app
          cd ../../../

          # Create DMG
          mkdir -p dmg_staging
          cp -R "$APP_PATH" dmg_staging/
          ln -s /Applications dmg_staging/Applications
          
          hdiutil create \
            -volname "Foldero" \
            -srcfolder dmg_staging \
            -ov \
            -format UDZO \
            dist/Foldero-macOS.dmg
          
          rm -rf dmg_staging
          
          ls -lh dist/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Foldero-macOS-Build
          path: |
            dist/Foldero-macOS.dmg
            dist/Foldero-macOS.zip
          retention-days: 14

      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Foldero-macOS.dmg
            dist/Foldero-macOS.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
